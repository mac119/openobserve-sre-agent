name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    name: Offline self-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security invariants
        run: python -m o2agent.sec_selftest

      - name: Context-management invariants
        run: python -m o2agent.ctx_selftest

      - name: UX invariants
        run: python -m o2agent.ux_selftest

      - name: HTTP/SSE API invariants (ephemeral port)
        run: python -m o2agent.server_selftest

      - name: Storage-backend invariants
        run: python -m o2agent.storage_selftest
